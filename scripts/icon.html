<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 180px; height: 180px; background: #e9ebe4; display: grid; place-items: center; }
  .mark { position: relative; width: 116px; height: 70px; }
  .mark::before { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 3px; background: #6a7166; border-radius: 2px; }
  .needle { position: absolute; top: 50%; left: 74%; width: 9px; height: 62px; margin: -31px 0 0 -4.5px; border-radius: 4px; background: #1f6f4a; }
</style></head><body><div class="mark"><span class="needle"></span></div></body></html>
